
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Beauty AI - Chat API Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f3f5;
      padding: 30px 16px;
      color: #29232a;
    }

    .container {
      max-width: 550px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 20px #00000010;
    }

    h2 { margin-top: 0; }

    button {
      background: #7d426b;
      color: white;
      border: 0;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #f7f3f5;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      min-height: 50px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Luxury Beauty AI</h2>
    <p>Groq AI receptionist connection test</p>

    <button id="testButton">Test AI Connection</button>

    <div id="result">Click the button to test the AI.</div>
  </div>

  <script>
    const button = document.getElementById("testButton");
    const result = document.getElementById("result");

    button.addEventListener("click", async () => {
      button.disabled = true;
      result.textContent = "Connecting to Groq AI...";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: [
              {
                role: "user",
                content: "Hello! Introduce yourself as the clinic's AI receptionist."
              }
            ]
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "API request failed: " + response.status);
        }

        result.textContent = "SUCCESS — AI RESPONSE:\n\n" + data.reply;

      } catch (error) {
        result.textContent = "CONNECTION FAILED:\n\n" + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
